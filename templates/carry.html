<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çok Faktörlü Motor</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--muted:#677180;--line:#e3e6ea;--pos:#1a7f4b;--neg:#c0392b;--accent:#2f6fde}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--fg:#e6e9ee;--muted:#8b95a3;--line:#262c35;--pos:#3ccf85;--neg:#ff6b5e;--accent:#6b9bff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 18px}
a{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .k{color:var(--muted);font-size:12px}.tile .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.card{margin-bottom:16px;overflow-x:auto}.card h2{font-size:15px;margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:500;font-size:12px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--muted)}
svg{width:100%;height:220px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 Çok Faktörlü Motor (v3)</h1>
  <p class="sub">3 eşit riskli kol: trend (28 gün) + kesitsel momentum (30 gün) + fonlama faktörü · 20 likit coin · günlük 1/7 dilim yenileme · sanal (paper) işlem · <a href="/">Ana panel</a></p>
  <div class="tiles" id="tiles"></div>
  <div class="card"><h2>Özsermaye</h2><div id="chart" class="muted">Veri bekleniyor…</div></div>
  <div class="grid2">
    <div class="card"><h2>Açık pozisyonlar</h2><div id="positions"></div></div>
    <div class="card"><h2>Hedef ağırlıklar ve 7 günlük fonlama (%)</h2><div id="signal"></div></div>
  </div>
  <div class="card"><h2>Son dolumlar</h2><div id="fills"></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const usd=v=>(v<0?"-":"")+"$"+Math.abs(v).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=v=>v>0?"pos":(v<0?"neg":"");
const px=v=>v>=100?v.toFixed(2):v>=1?v.toFixed(4):v.toPrecision(5);
function tile(k,v,c=""){return `<div class="tile"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`}
function chart(pts){
  if(!pts||pts.length<2){$("chart").textContent="Henüz yeterli özsermaye kaydı yok (saatlik kaydedilir).";return}
  const W=1000,H=220,P=30,vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),r=(mx-mn)||1;
  const x=i=>P+i*(W-2*P)/(pts.length-1),y=v=>H-P-(v-mn)*(H-2*P)/r;
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  $("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Özsermaye eğrisi">
   <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
   <text x="${P}" y="14" fill="var(--muted)" font-size="12">${usd(mx)}</text>
   <text x="${P}" y="${H-8}" fill="var(--muted)" font-size="12">${usd(mn)} · ${pts[0].t.slice(0,16)} → ${pts[pts.length-1].t.slice(0,16)} UTC</text></svg>`;
}
async function load(){
  try{
    const r=await fetch("/api/carry");const d=await r.json();
    if(d.error){$("tiles").innerHTML=tile("Hata",d.error);return}
    $("tiles").innerHTML=[
      tile("Özsermaye",usd(d.equity)),
      tile("Toplam K/Z",usd(d.pnl)+` (${d.pnl_pct.toFixed(2)}%)`,cls(d.pnl)),
      tile("Tepeden düşüş",d.drawdown_pct.toFixed(2)+"%",d.drawdown_pct<-5?"neg":""),
      tile("Fonlama (+ ödenen / − alınan)",usd(d.funding_paid),cls(-d.funding_paid)),
      tile("Komisyon",usd(d.fees_paid)),
      tile("Brüt / net maruziyet",usd(d.gross_exposure)+" / "+usd(d.net_exposure)),
      tile("Risk ölçeği",d.scale.toFixed(1)+"x",d.scale<1?"neg":""),
      tile("Son / sonraki dengeleme",(d.last_rebalance||"—").slice(5,16)+" / "+d.next_rebalance.slice(5,16)),
    ].join("");
    chart(d.equity_curve);
    $("positions").innerHTML=d.positions.length?`<table><tr><th>Coin</th><th>Yön</th><th>Notional</th><th>Giriş</th><th>Fiyat</th><th>K/Z</th></tr>${
      d.positions.sort((a,b)=>b.notional-a.notional).map(p=>`<tr><td>${p.symbol.replace("USDT","")}</td><td class="${p.side=="LONG"?"pos":"neg"}">${p.side}</td><td>${usd(Math.abs(p.notional))}</td><td>${px(p.avg_price)}</td><td>${px(p.price)}</td><td class="${cls(p.upnl)}">${usd(p.upnl)}</td></tr>`).join("")}</table>`:'<p class="muted">Pozisyon yok.</p>';
    const sig=Object.entries(d.last_signal||{});
    $("signal").innerHTML=sig.length?`<table><tr><th>Coin</th><th>Fonlama 7g %</th><th>Hedef ağırlık</th></tr>${
      sig.map(([s,v])=>{const w=(d.targets||{})[s]||0;return `<tr><td>${s.replace("USDT","")}</td><td>${v.toFixed(4)}</td><td class="${cls(w)}">${w?(w*100).toFixed(1)+"%":"—"}</td></tr>`}).join("")}</table>`:'<p class="muted">Henüz sinyal yok.</p>';
    $("fills").innerHTML=d.fills.length?`<table><tr><th>Zaman (UTC)</th><th>Coin</th><th>Yön</th><th>Notional</th><th>Fiyat</th><th>Komisyon</th><th>Gerç. K/Z</th></tr>${
      d.fills.map(f=>`<tr><td>${f.ts.slice(5,16)}</td><td>${f.symbol.replace("USDT","")}</td><td class="${f.side=="BUY"?"pos":"neg"}">${f.side}</td><td>${usd(f.notional)}</td><td>${px(f.price)}</td><td>${usd(f.fee)}</td><td class="${cls(f.realized_pnl)}">${usd(f.realized_pnl)}</td></tr>`).join("")}</table>`:'<p class="muted">Henüz dolum yok.</p>';
  }catch(e){$("tiles").innerHTML=tile("Bağlantı hatası",String(e))}
}
load();setInterval(load,30000);
</script>
</body>
</html>
